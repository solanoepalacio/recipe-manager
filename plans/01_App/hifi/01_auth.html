<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth — Robotina Cooks</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #22201C;
    padding: 48px;
    display: flex;
    gap: 48px;
    align-items: flex-start;
  }

  /* ===== FRAME LABELS ===== */
  .frame-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .frame-label {
    font-size: 13px;
    font-weight: 500;
    color: #8A8680;
    letter-spacing: 0.5px;
  }

  /* ===== PHONE FRAME ===== */
  .phone {
    width: 375px;
    height: 812px;
    background: #FAFAF7;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ===== LOGIN CONTENT ===== */
  .login-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    gap: 0;
  }

  /* Logo / icon area */
  .login-logo {
    width: 64px;
    height: 64px;
    background: #F4F2ED;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    color: #5EBD6A;
  }

  /* Heading */
  .login-heading {
    font-size: 28px;
    font-weight: 700;
    color: #2C2C2A;
    letter-spacing: -0.5px;
    text-align: center;
    margin-bottom: 8px;
  }

  .login-subtitle {
    font-size: 14px;
    font-weight: 400;
    color: #8A8680;
    text-align: center;
    margin-bottom: 48px;
  }

  /* Form */
  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: 13px;
    font-weight: 500;
    color: #2C2C2A;
    letter-spacing: 0.1px;
  }

  .field-input {
    width: 100%;
    background: #F4F2ED;
    border: 1.5px solid #E0DCD5;
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: #2C2C2A;
    outline: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .field-input-inner {
    flex: 1;
    font-size: 15px;
    color: #C8C4BD;
  }

  .field-input-row {
    width: 100%;
    background: #F4F2ED;
    border: 1.5px solid #E0DCD5;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .field-icon {
    display: flex;
    align-items: center;
    color: #8A8680;
    flex-shrink: 0;
  }

  .field-placeholder {
    flex: 1;
    font-size: 15px;
    color: #C8C4BD;
  }

  /* Button */
  .btn {
    border-radius: 20px;
    padding: 16px 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: center;
    margin-top: 10px;
  }

  .btn-filled {
    background: #2C2C2A;
    color: #FAFAF7;
  }

</style>
</head>
<body>

  <div class="frame-wrapper">
    <div class="frame-label">Inicio de sesion</div>
    <div class="phone">
      <div class="login-content">

        <!-- Logo mark -->
        <div class="login-logo">
          <i data-lucide="utensils" width="28" height="28"></i>
        </div>

        <!-- Heading -->
        <div class="login-heading">Robotina Cooks</div>
        <div class="login-subtitle">Tu asistente de recetas personales</div>

        <!-- Form -->
        <div class="login-form">

          <!-- Email -->
          <div class="field-group">
            <div class="field-label">Correo electrónico</div>
            <div class="field-input-row">
              <div class="field-icon">
                <i data-lucide="mail" width="16" height="16"></i>
              </div>
              <div class="field-placeholder">tu@correo.com</div>
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <div class="field-label">Contraseña</div>
            <div class="field-input-row">
              <div class="field-icon">
                <i data-lucide="lock" width="16" height="16"></i>
              </div>
              <div class="field-placeholder">••••••••</div>
            </div>
          </div>

          <!-- Submit -->
          <button class="btn btn-filled">Iniciar sesión</button>

        </div>

      </div>
    </div>
  </div>

<script>lucide.createIcons();</script>
</body>
</html>
